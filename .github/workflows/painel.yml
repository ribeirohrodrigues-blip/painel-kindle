name: Painel do Kindle

on:
  schedule:
    - cron: '7,37 * * * *'   # a cada 30 min (o GitHub às vezes atrasa alguns minutos)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar imagem
        run: node gerar.mjs && cp saida/painel.html saida/index.html
        env:
          GOOGLE_WEATHER_KEY: ${{ secrets.GOOGLE_WEATHER_KEY }}
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: saida
      - id: publicar
        uses: actions/deploy-pages@v4
      - name: Manter o agendamento ativo
        # O GitHub desliga agendamentos de repositórios sem commits há 60 dias.
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter agendamento ativo [skip ci]"
            git push
          fi
